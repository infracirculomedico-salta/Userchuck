<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso al Portal — WhatsApp Círculo Médico de Salta</title>
  <link rel="stylesheet" href="/static/css/portal.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #0b1f38 0%, #071526 100%);
      padding: 20px;
    }
    .login-box {
      width: 100%;
      max-width: 440px;
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-xl);
      padding: 40px 36px;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.4);
      position: relative;
      overflow: hidden;
    }
    .login-box::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(90deg, var(--primary), var(--wsp-green));
    }
    .login-header {
      text-align: center;
      margin-bottom: 30px;
    }
    .login-logo {
      width: 64px;
      height: 64px;
      background: linear-gradient(135deg, var(--primary) 0%, var(--cms-navy) 100%);
      border-radius: 18px;
      margin: 0 auto 16px auto;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 28px;
      box-shadow: 0 8px 20px var(--primary-glow);
    }
    .login-header h1 {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 4px;
    }
    .login-header p {
      font-size: 13px;
      color: var(--text-muted);
    }
    .login-alert {
      padding: 10px 14px;
      border-radius: var(--radius-md);
      font-size: 13px;
      margin-bottom: 20px;
      display: none;
    }
    .login-alert.danger {
      background-color: var(--danger-bg);
      color: var(--danger);
      display: block;
    }
    .demo-credentials {
      background-color: var(--bg-surface-alt);
      border: 1px dashed var(--border-color);
      border-radius: var(--radius-md);
      padding: 12px 14px;
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 24px;
    }
  </style>
</head>
<body>

  <div class="login-box">
    <div class="login-header">
      <div class="login-logo">
        <i class="fab fa-whatsapp"></i>
      </div>
      <h1>Círculo Médico de Salta</h1>
      <p>Portal de Gestión de WhatsApp Business</p>
    </div>

    <div id="login-error" class="login-alert danger" style="display: none;"></div>

    <form id="form-login" onsubmit="realizarLogin(event)">
      <div class="form-group">
        <label class="form-label" for="username">Usuario</label>
        <div style="position: relative;">
          <input type="text" id="username" class="form-input" style="padding-left: 38px;" placeholder="Ingresa tu usuario" required autofocus>
          <i class="fas fa-user" style="position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-light);"></i>
        </div>
      </div>

      <div class="form-group" style="margin-bottom: 24px;">
        <label class="form-label" for="password">Contraseña</label>
        <div style="position: relative;">
          <input type="password" id="password" class="form-input" style="padding-left: 38px;" placeholder="••••••••" required>
          <i class="fas fa-lock" style="position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-light);"></i>
        </div>
      </div>

      <button type="submit" id="btn-submit" class="btn btn-whatsapp" style="width: 100%; padding: 12px; font-size: 15px;">
        <i class="fas fa-sign-in-alt"></i> Iniciar Sesión
      </button>
    </form>
  </div>

  <script>
    async function realizarLogin(e) {
      e.preventDefault();
      const elUser = document.getElementById('username');
      const elPass = document.getElementById('password');
      const elBtn = document.getElementById('btn-submit');
      const elErr = document.getElementById('login-error');

      elErr.style.display = 'none';
      elBtn.disabled = true;
      elBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Verificando...';

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: elUser.value,
            password: elPass.value
          })
        });

        const data = await res.json();
        if (res.ok) {
          window.location.href = '/';
        } else {
          elErr.textContent = data.detail || 'Usuario o contraseña incorrectos';
          elErr.style.display = 'block';
        }
      } catch (err) {
        elErr.textContent = 'Error de conexión con el servidor';
        elErr.style.display = 'block';
      } finally {
        elBtn.disabled = false;
        elBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Iniciar Sesión';
      }
    }
  </script>

</body>
</html>
